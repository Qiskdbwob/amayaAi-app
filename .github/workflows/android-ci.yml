name: Android CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing, downloading wrapper jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests (debug)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build perf APK (R8-optimized, debug-signed, for performance testing)
        run: ./gradlew :app:assemblePerf --stacktrace

      - name: Upload debug APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: amaya-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload perf APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: amaya-perf-apk
          path: app/build/outputs/apk/perf/*.apk
          if-no-files-found: error

  build-release:
    name: Build signed release APK + GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing, downloading wrapper jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The build reads rootProject/.env.local for signing (see app/build.gradle.kts).
      # Secrets cannot be referenced directly in `if:` conditions, so they are checked here.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AMAYA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AMAYA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMAYA_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing. Add AMAYA_KEYSTORE_BASE64 (base64 of release.keystore), AMAYA_KEYSTORE_PASSWORD and AMAYA_KEY_ALIAS under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "AMAYA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" > .env.local
          echo "AMAYA_KEY_ALIAS=$KEY_ALIAS" >> .env.local

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: amaya-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
